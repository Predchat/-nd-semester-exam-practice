<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f5c63">
<title>Exam Practice</title>
<style>
:root{--bg:#f6f8f8;--fg:#14201f;--card:#fff;--line:#c9d6d5;--pri:#0f5c63;--on:#fff;--ok:#16794a;--okb:#dff3e8;--bad:#b3261e;--badb:#fbe3e1;--mut:#4d605f;--fs:18px}
@media(prefers-color-scheme:dark){:root{--bg:#101616;--fg:#eef4f3;--card:#192222;--line:#344645;--pri:#5fc2c9;--on:#062326;--ok:#6fdc9f;--okb:#17352a;--bad:#ff8a80;--badb:#3d1c1a;--mut:#a9bcbb}}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:1rem 1rem 5.5rem}
main{max-width:640px;margin:0 auto}
h1{font-size:1.4rem;margin:.2rem 0 1rem}
label{display:block;margin:1rem 0 .3rem;font-weight:600}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:.7rem;border:2px solid var(--line);border-radius:.6rem;background:var(--card)}
button{min-height:3rem;padding:.6rem 1rem;border:2px solid var(--line);border-radius:.6rem;background:var(--card);cursor:pointer}
button:disabled{opacity:.4}
.pri{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:700}
.full{width:100%;margin-top:1rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:.8rem;padding:1rem;margin:.8rem 0}
.opt{display:block;width:100%;text-align:left;margin:.6rem 0}
.sel{border-color:var(--pri);background:var(--pri);color:var(--on)}
.ok{border-color:var(--ok);background:var(--okb);color:var(--fg)}
.bad{border-color:var(--bad);background:var(--badb);color:var(--fg)}
.en{color:var(--mut);margin-top:.35rem}
.sel .en{color:var(--on)}
.m{color:var(--mut);margin:.2rem 0}
.row{display:flex;gap:.6rem;margin-top:1rem}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;min-height:3.6rem;background:none}
nav .on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px var(--pri)}
.big{font-size:2.4rem;font-weight:700}
</style></head><body><main id="app"></main><div id="nv"></div>
<script>
const app=document.getElementById('app'),$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('ep'))}catch(e){}
S=S||{subs:{},cfg:{model:'anthropic/claude-sonnet-4.5',fs:18,key:''}};
const save=()=>localStorage.setItem('ep',JSON.stringify(S));
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fs=()=>document.documentElement.style.setProperty('--fs',S.cfg.fs+'px');fs();
let V='exsub',D=null,Q=null,Sub='';
const go=v=>{V=v;R();scrollTo(0,0)};
const PW='9903b7af8f28355dd09a3a1af1558401d357105dc05d9a8ec26a544e8669a8af';
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ep-v1:'+t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const ok=()=>localStorage.getItem('ep_ok')===PW;

function parse(t){
  return t.split(/^\s*Q\d+\.\s*/m).slice(1).map(b=>{
    const qs=[],o=[];
    b.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
      const m=l.match(/^(\d+)\.\s*(.*)$/);
      if(m)o.push(m[2]);else if(!o.length)qs.push(l);
    });
    return{q:qs.join(' '),o,a:null};
  }).filter(x=>x.q&&x.o.length>1);
}
async function translate(qs){
  const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.cfg.key},
    body:JSON.stringify({model:S.cfg.model,messages:[{role:'user',content:
    'Translate these Korean university engineering quiz questions and answer options into English. Reply ONLY with a JSON array, same length and order, each item {"q":"...","o":["..."]} with the same number of options. Keep O and X unchanged.\n'+JSON.stringify(qs.map(x=>({q:x.q,o:x.o})))}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
  const t=j.choices[0].message.content,a=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1));
  if(a.length!==qs.length)throw new Error('Translation count mismatch');
  qs.forEach((x,i)=>{x.qe=a[i].q;x.oe=a[i].o});
}
const busy=m=>{app.innerHTML=`<h1>${m}</h1><p class="m">Please keep this page open.</p>`};

function R(){
  const AS=getSubs(),subs=Object.keys(AS);let h='';
  if((V=='upload'||V=='answers')&&!ok()){
    h=`<h1>Upload is locked</h1><p class="m">Only people with the password can add quizzes.</p><label>Password</label><input id="pw" type="password" autocomplete="off"><button class="pri full" data-a="unlock">Unlock</button>`;
  }else if(V=='upload'){
    h=`<h1>Add a quiz</h1>
    <label>Subject</label>
    <select id="sub">${subs.map(s=>`<option>${esc(s)}</option>`).join('')}<option value="">+ New subject</option></select>
    <input id="ns" placeholder="New subject name" style="margin-top:.6rem;${subs.length?'display:none':''}">
    <label>Quiz text file (.txt)</label><input id="file" type="file" accept=".txt,text/plain">
    <label>Exam name (optional)</label><input id="ti" placeholder="e.g. Lecture 3">
    <button class="pri full" data-a="up">Next: set correct answers</button><button class="full" data-a="lock">Lock upload</button>`;
  }else if(V=='answers'){
    const q=D.qs[D.i],n=D.qs.length;
    h=`<h1>Set correct answers</h1><p class="m">${esc(D.title)} · question ${D.i+1} of ${n}</p>
    <div class="card"><b>${esc(q.q)}</b></div><p class="m">Tap the correct answer:</p>`+
    q.o.map((o,k)=>`<button class="opt ${q.a===k?'sel':''}" data-a="setans" data-v="${k}">${k+1}. ${esc(o)}</button>`).join('')+
    `<div class="row"><button data-a="prev" ${D.i?'':'disabled'}>Back</button>${D.i<n-1?'<button data-a="next">Next</button>':'<button class="pri" data-a="finish">Save exam</button>'}</div>`;
  }else if(V=='exsub'){
    h=`<h1>Choose a subject</h1>`+(subs.length?subs.map(s=>`<button class="opt" data-a="subj" data-v="${esc(s)}">${esc(s)} (${AS[s].length})</button>`).join(''):`<p>No exams yet. Add a quiz first.</p>`);
  }else if(V=='exlist'){
    const L=AS[Sub]||[];
    h=`<h1>${esc(Sub)}</h1>`+(L.length?L.map(e=>{
      const set=e.qs.filter(x=>x.a!=null).length,en=e.qs[0]&&e.qs[0].qe;
      return `<div class="card"><b>${esc(e.title)}</b><p class="m">${e.b?'Built-in · ':''}${e.qs.length} questions · answers set ${set}/${e.qs.length} · ${en?'KR + EN':'Korean only'}</p>
      <button class="pri full" data-a="start" data-w="${e.id}">Start exam</button>
      ${e.b?'':`<div class="row"><button data-a="edit" data-w="${e.id}">Edit answers</button>${en?'':`<button data-a="tr" data-w="${e.id}">Translate</button>`}<button data-a="del" data-w="${e.id}">Delete</button></div>`}</div>`}).join(''):'<p>No exams in this subject.</p>')+
      `<button class="full" data-a="go" data-v="exsub">Back to subjects</button>`;
  }else if(V=='quiz'){
    const n=Q.ex.qs.length,x=Q.ex.qs[Q.i],d=Q.sel[Q.i]!=null;
    h=`<p class="m">${esc(Q.ex.title)} · ${Q.i+1} / ${n}</p>
    <div class="card"><b>${esc(x.q)}</b>${x.qe&&(!Q.ex.lt||d)?`<div class="en">${esc(x.qe)}</div>`:''}</div>`+
    x.o.map((o,k)=>{let c='opt';
      if(d&&x.a!=null){if(k===x.a)c+=' ok';else if(k===Q.sel[Q.i])c+=' bad'}else if(d&&k===Q.sel[Q.i])c+=' sel';
      return `<button class="${c}" data-a="pick" data-v="${k}">${k+1}. ${esc(o)}${x.oe&&(!Q.ex.lt||d)?`<div class="en">${esc(x.oe[k])}</div>`:''}</button>`}).join('')+
    (d?`<p><b>${x.a==null?'No answer key set for this question':Q.sel[Q.i]===x.a?'✔ Correct':'✘ Wrong'}</b></p><button class="pri full" data-a="nq">${Q.i<n-1?'Next question':'See result'}</button>`:'');
  }else if(V=='result'){
    const qs=Q.ex.qs,keyed=qs.filter(x=>x.a!=null),right=qs.filter((x,i)=>x.a!=null&&Q.sel[i]===x.a).length;
    const wr=qs.map((x,i)=>[x,i]).filter(([x,i])=>x.a!=null&&Q.sel[i]!==x.a);
    h=`<h1>Result</h1><div class="card"><div class="big">${right} / ${keyed.length}</div></div>`+
    (wr.length?`<h1>Review wrong answers</h1>`+wr.map(([x,i])=>`<div class="card"><b>${esc(x.q)}</b>${x.qe?`<div class="en">${esc(x.qe)}</div>`:''}
      <p>Your answer: ${Q.sel[i]!=null?esc(x.o[Q.sel[i]]):'-'}</p><p><b>Correct: ${esc(x.o[x.a])}</b>${x.oe?`<span class="en"> (${esc(x.oe[x.a])})</span>`:''}</p></div>`).join(''):'<p><b>All correct!</b></p>')+
    `<div class="row"><button class="pri" data-a="start" data-w="${Q.ex.id}">Try again</button><button data-a="go" data-v="exlist">Back</button></div>`;
  }else if(V=='settings'){
    h=`<h1>Settings</h1>
    ${ok()?`<label>OpenRouter API key (stored only on this phone)</label><input id="key" type="password" value="${esc(S.cfg.key)}" placeholder="sk-or-...">
    <label>Model</label><input id="model" value="${esc(S.cfg.model)}">
    <button class="pri full" data-a="cfg">Save settings</button>`:''}
    <label>Text size: ${S.cfg.fs}px</label>
    <div class="row"><button data-a="fs" data-v="-1">A −</button><button data-a="fs" data-v="1">A +</button></div>
    <label>Backup</label>
    <div class="row"><button data-a="exp">Download backup</button><button data-a="imp">Restore backup</button></div>
    <input id="bk" type="file" accept=".json" style="display:none">`;
  }
  app.innerHTML=h;
  const t={upload:'upload',answers:'upload',settings:'settings'}[V]||'exsub';
  $('#nv').innerHTML=`<nav>${[['upload','Add quiz'],['exsub','Exam'],['settings','Settings']].map(([k,l])=>`<button data-a="go" data-v="${k}" class="${t==k?'on':''}">${l}</button>`).join('')}</nav>`;
}

const find=id=>(getSubs()[Sub]||[]).find(e=>e.id==id);
const BUILTIN={"Basic Mechanics 기초역학":[{"id":"b1","title":"01 Engineering intro","qs":[{"q":"기계공학의 기본 4대 역학에 해당 되지 않는 것은?","o":["고체역학","유체역학","정역학","열역학"],"qe":"Which of the following is NOT one of the four basic mechanics of mechanical engineering?","a":2,"oe":["Mechanics of solids","Fluid mechanics","Statics","Thermodynamics"]},{"q":"기계공학에서 제조분야에 대한 분류중에, 제조장비의 유지 보수, 생산을 위한 자동화 장비 개발등에 해당되는 것은?","o":["생산기술분야","구매분야"],"qe":"Within the manufacturing field classification of mechanical engineering, which covers maintenance of manufacturing equipment and development of automated equipment for production?","a":0,"oe":["Production engineering","Purchasing"]},{"q":"기계분야에서는 자동차공학, 로봇, 드론 등을 AI와 접목하여 4차 산업혁명에 따라 육성되고 있는 분야는?","o":["모빌리티","전기자동차","스마트펙토리","디지털트윈"],"qe":"In mechanical engineering, which field combines automobile engineering, robots, drones, etc. with AI and is being fostered under the 4th Industrial Revolution?","a":0,"oe":["Mobility","Electric vehicles","Smart factory","Digital twin"]},{"q":"공학이란  나은 기술을 개발 하기 위해 수학, 과학, 재료등을 유용하게 활용하여 산업발전에 이바지 하는 것이다.","o":["O","X"],"qe":"Engineering is the useful application of mathematics, science, materials, etc. to develop better technology and contribute to industrial development.","a":0}],"b":1},{"id":"b2","title":"02 The mechanical engineer, ISO and ASME","qs":[{"q":"4차산업혁명을 통하여 기계공학자들은 여러 분야의 융합된 엔지니어로써 활동해야 한다.","o":["O","X"],"qe":"Through the 4th Industrial Revolution, mechanical engineers must work as engineers with converged knowledge from many fields.","a":0},{"q":"국제표준화기구는 ISO이다.","o":["O","X"],"qe":"The International Organization for Standardization is ISO.","a":0},{"q":"미국기계공학회는 ASME라고 한다.","o":["O","X"],"qe":"The American Society of Mechanical Engineers is called ASME.","a":0},{"q":"기계공학자의 핵심은 혁신과 설계라고 볼 수 있다.","o":["O","X"],"qe":"The core of a mechanical engineer can be seen as innovation and design.","a":0}],"b":1},{"id":"b3","title":"03 Design process","qs":[{"q":"고고학자들의 설계 프로세스는 준비, 발굴, 평가, 설명의 순으로 수행한다.","o":["O","X"],"qe":"Archaeologists' design process is carried out in the order: preparation, excavation, evaluation, explanation.","a":0},{"q":"기계설계중에 상세설계단계에서는 제품 배치도, 재료 선택, 시스템 시뮬레이션등을 수행한다.","o":["O","X"],"qe":"In mechanical design, the detailed design stage involves product layout, material selection, system simulation, etc.","a":1},{"q":"아이디어들을 선별하고 소수의 최적 설계 개념을 도출하고, CAD 모델링 및 시제품등에 분석은 수렴적 사고에 해당된다.","o":["O","X"],"qe":"Screening ideas, deriving a few optimal design concepts, and analysis through CAD modeling and prototypes are convergent thinking.","a":0},{"q":"기계공학자의 문서화 작업중에, 기술에 대한 권한을 가지는 행위는 의장특허, 실용특허 등을 활용한다.","o":["O","X"],"qe":"Among a mechanical engineer's documentation work, obtaining rights to a technology uses design patents, utility patents, etc.","a":0}],"b":1},{"id":"b4","title":"04 Manufacturing processes","qs":[{"q":"주철, 알루미늄 혹은 청동과 같은 액체상태 금속을 틀에 부어 냉각 후 굳히는 공정을 주조하라고 한다.","o":["O","X"],"qe":"Pouring liquid metal such as cast iron, aluminum, or bronze into a mold and letting it cool and solidify is called casting.","a":0},{"q":"금속 판재를 롤러 사이에서 압축하여 정해진 두께로 제조를 압연이라고 한다.","o":["O","X"],"qe":"Compressing sheet metal between rollers to make a specified thickness is called rolling.","a":0},{"q":"부품 및 제품을 만들기 위하여, 열가소성수지, 광중합체등을 활용하여 CAD와 연동하여 제작하는 방법을 쾌속조형법이라고 한다.","o":["O","X"],"qe":"Making parts and products linked with CAD using thermoplastics, photopolymers, etc. is called rapid prototyping.","a":0},{"q":"MCT는 자동으로 공구를 바꾸어 가며 형상을 만들어내는 가공기계을 말한다.","o":["O","X"],"qe":"MCT refers to a machine tool that automatically changes tools to create shapes.","a":0}],"b":1},{"id":"b5","title":"05 Problem solving","qs":[{"q":"문제해결 풀이 단계는 접근방법, 풀이, 검토의 3단계가 기본이다.","o":["O","X"],"qe":"The problem-solving process has three basic steps: approach, solution, and review.","a":0},{"q":"화성 기후 탐사위성 실종 사건은 단위환산의 의사 소통 문제로 발생한 유명한 사건이다.","o":["O","X"],"qe":"The loss of the Mars climate orbiter is a famous incident caused by a unit-conversion communication problem.","a":0},{"q":"캐나다 항공 143편 비행기 비상착륙사건은 무게 단위환산 문제로 인한 비행기 연료 부족으로 불시착사건으로 유명하다.","o":["O","X"],"qe":"The Air Canada Flight 143 emergency landing is famous as a forced landing caused by fuel shortage due to a weight unit-conversion error.","a":0},{"q":"문제해결 단계중에 단계적 계산과 함께 설명과 그림을 포함하여 수행하는 것은 풀이 단계이다.","o":["O","X"],"qe":"In problem solving, the step that includes step-by-step calculations along with explanations and figures is the solution step.","a":0}],"b":1},{"id":"b6","title":"06 Units (SI and USCS)","qs":[{"q":"단위계에는 국제단위계(SI)와 미국전통단위계(USCS)가 있다.","o":["O","X"],"qe":"The systems of units are the International System (SI) and the US Customary System (USCS).","a":0},{"q":"국제단위계에서 길이(m), 질량(kg), 시간(s) 등으로 표기되면 기본단위계이다.","o":["O","X"],"qe":"In SI, quantities written as length (m), mass (kg), time (s), etc. are base units.","a":0},{"q":"크기 접두사중에 “기가”는 “G”로 표기되며, 10의 9승 의 값을 가진다.","o":["O","X"],"qe":"Among size prefixes, 'giga' is written 'G' and has a value of 10 to the 9th power.","a":0},{"q":"무게는 질량에서 중력가속도를 곱한 것으로 계산된다.","o":["O","X"],"qe":"Weight is calculated as mass multiplied by gravitational acceleration.","a":0}],"b":1},{"id":"b7","title":"07 Units and conversion","qs":[{"q":"힘은 N으로 표시되며, 질량과 가속도의 곱으로 나타난다.","o":["O","X"],"qe":"Force is expressed in N and is the product of mass and acceleration.","a":0},{"q":"1 마력은 0.7457kW으로 표시가 가능하다.","o":["O","X"],"qe":"1 horsepower can be expressed as 0.7457 kW.","a":0},{"q":"미국전통단위계에서 gal.은 부피를 나타낸다.","o":["O","X"],"qe":"In the US Customary System, gal. represents volume.","a":0},{"q":"미국전통단위계에서 mi는 거리를 나타낸다.","o":["O","X"],"qe":"In the US Customary System, mi represents distance.","a":0}],"b":1},{"id":"b8","title":"08 Estimation and significant digits","qs":[{"q":"불완전하고 부정확한 주먹구구식 계산이지만 없는 것보다 낫다. 이 계산은 비공식적으로 신속히 수행할 수 있으므로 간이 계산 이라고도 한다.","o":["O","X"],"qe":"A rough, imprecise back-of-the-envelope calculation is better than none. It can be done quickly and informally, so it is also called a quick estimate.","a":0},{"q":"차원 일치(dimensional consistency)란 방정식 등호 양쪽의 수치값과 관련 단위가 일치해야 함을 의미한다.","o":["O","X"],"qe":"Dimensional consistency means the numerical values and associated units on both sides of an equation's equals sign must match.","a":0},{"q":"어떤 숫자의 정확도(precision)는 그 숫자를 나타내는 데 사용된 마지막 유효숫자 크기의 절반이다.","o":["O","X"],"qe":"The precision of a number is half the magnitude of the last significant digit used to represent it.","a":0},{"q":"유효숫자(significant digits)는 주어진 정보, 근사과정, 계산 자체에 존재하는 오 차범위의 관점에서 정확하고 신뢰할 만하다고 알려진 숫자이다.","o":["O","X"],"qe":"Significant digits are digits known to be accurate and reliable in view of the error range in the given information, the approximation process, and the calculation itself.","a":0}],"b":1},{"id":"b9","title":"09 Technical reports and presentations","qs":[{"q":"공학보고서에는 표지, 요약문, 보고서 본문, 목차, 결론, 부록등으로 구성이 되어야 한다.","o":["O","X"],"qe":"An engineering report should consist of a cover, abstract, main body, table of contents, conclusion, appendix, etc.","a":0},{"q":"기술보고서에는 그림, 그래프, 차트, 표등이 포함하여야 한다.","o":["O","X"],"qe":"A technical report should include figures, graphs, charts, tables, etc.","a":0},{"q":"기술보고서는 서술형 문장으로 작성하여, 교재나 일반 책자의 형식을 작성한다.","o":["O","X"],"qe":"A technical report should be written in narrative sentences, in the format of a textbook or general book.","a":1},{"q":"기술적인 발표의 종류는 조직상의 회의, 세미나, 학술대회, 고객의 프리젠테이션 등을 포함한다.","o":["O","X"],"qe":"Types of technical presentations include organizational meetings, seminars, academic conferences, and customer presentations.","a":0}],"b":1},{"id":"b10","title":"10 Data and trendlines","qs":[{"q":"상용프로그램을 활용하여, 추세선의 수식을 구하면 측정하지 않은 부분 혹은 구간에서도 예측이 가능하다.","o":["O","X"],"qe":"Using commercial software to obtain the trendline equation makes it possible to predict even in unmeasured parts or ranges.","a":0},{"q":"데이터를 입력후, 데이터 값을 항목별로 자릿수를 정리하여 일치시킨다.","o":["O","X"],"qe":"After entering data, align the number of decimal places of each item's values.","a":0},{"q":"스프링의 하중을 계산하기 위해서는  F=kx의 기본식을 활용한다.","o":["O","X"],"qe":"To calculate a spring's load, the basic equation F=kx is used.","a":0},{"q":"실험 데이터에서, 질량을 먼저 구하고, 변위를 구했다면 질량을 이용하여 하중을 계산해야, F=kx에 대한 그래프를 구해 낼 수 있다.","o":["O","X"],"qe":"In experimental data, if mass was found first and then displacement, the load must be calculated from mass to obtain the F=kx graph.","a":0}],"b":1},{"id":"b11","title":"11 Vectors and scalars","qs":[{"q":"삼각함수의 사인법칙은  A /sin a  =  B / sin b   =  C / sin c 이다.","o":["O","X"],"qe":"The law of sines is A / sin a = B / sin b = C / sin c.","a":0},{"q":"스칼라는 크기만을 나타내며, 질량, 길이등이 있다.","o":["O","X"],"qe":"A scalar expresses magnitude only, such as mass and length.","a":0},{"q":"벡터의 구성요소는 크기, 방향, 작용점을 가지고 있다.","o":["O","X"],"qe":"The components of a vector are magnitude, direction, and point of application.","a":0},{"q":"벡터 A 와 벡터 –A는 크기는 같고, 방향이 반대이다.","o":["O","X"],"qe":"Vector A and vector –A have the same magnitude and opposite directions.","a":0}],"b":1},{"id":"b12","title":"12 Vector composition","qs":[{"q":"2개이상의 벡터의 합성 벡터를 구하기 위하여, 평행사변형법 혹은 다각형법을 사용하면 된다.","o":["O","X"],"qe":"To find the resultant of two or more vectors, the parallelogram method or polygon method can be used.","a":0},{"q":"3개이상의 벡터의 합성 벡터를 구하기 위해서는 CAD등과 같이 도식적으로 확인하면 편리하다.","o":["O","X"],"qe":"To find the resultant of three or more vectors, it is convenient to check graphically, such as in CAD.","a":0},{"q":"모든 벡터 성분은 x, y, z축에 맞게 성분 분해가 가능하며, 계산도 편리하다.","o":["O","X"],"qe":"Every vector can be resolved into components along the x, y, z axes, and calculation is convenient.","a":0},{"q":"3개이상의 벡터의 합성은 각 벡터의 성분을 분해하여, 각각의 성분 즉, x 성분, y 성분을 합하여, 합성 성분을 계산 할 수 있다.","o":["O","X"],"qe":"The resultant of three or more vectors can be calculated by resolving each vector into components and summing the x components and y components.","a":0}],"b":1}],"Mechatronics 메카트로닉스 현장전문용어":[{"id":"m3","title":"Lesson 3","qs":[{"q":"재료의 경도 측정법이 아닌 것은?","o":["샤르피시험법","반발에 의한 방법","긋기에 의한 방법","압입경도시험"],"a":0,"qe":"Which of  of '버리다' (to throw away) is '줍다' (to pick up)."},{"q":"‘세다’의 반대말은 ‘강하다’이다.","o":["O","X"],"a":1,"qe":"The opposite of '세다' (strong) is '강하다' (strong)."},{"q":"'예방하다’의 반대말은 ‘막다’이다.","o":["O","X"],"a":1,"qe":"The opposite of '예방하다' (to prevent) is '막다' (to block/prevent)."}],"b":1,"lt":1},{"id":"t8","title":"Quiz 08","qs":[{"q":"‘감소하다’의 반대말은 ‘증가하다’이다.","o":["O","X"],"a":0,"qe":"The opposite of '감소하다' (to decrease) is '증가하다' (to increase)."},{"q":"‘늘다’의 반대말은 ‘줄다’이다.","o":["O","X"],"a":0,"qe":"The opposite of '늘다' (to increase) is '줄다' (to decrease)."},{"q":"‘최소’의 반대말은 ‘최대’이다.","o":["O","X"],"a":0,"qe":"The opposite of '최소' (minimum) is '최대' (maximum)."},{"q":"‘초보’의 반대말은 ‘전문가’이다.","o":["O","X"],"a":0,"qe":"The opposite of '초보' (beginner) is '전문가' (expert)."}],"b":1,"lt":1},{"id":"t9","title":"Quiz 09","qs":[{"q":"‘녹다’의 반대말은 ‘얼다’이다.","o":["O","X"],"a":0,"qe":"The opposite of '녹다' (to melt) is '얼다' (to freeze)."},{"q":"‘죽다’의 반대말은 ‘살다’이다.","o":["O","X"],"a":0,"qe":"The opposite of '죽다' (to die) is '살다' (to live)."},{"q":"‘배고프다’의 반대말은 ‘배부르다’이다.","o":["O","X"],"a":0,"qe":"The opposite of '배고프다' (hungry) is '배부르다' (full)."},{"q":"‘오르다’의 반대말은 ‘상승하다’이다.","o":["O","X"],"a":1,"qe":"The opposite of '오르다' (to go up) is '상승하다' (to rise)."}],"b":1,"lt":1},{"id":"t10","title":"Quiz 10","qs":[{"q":"‘올라가다’의 반대말은 ‘내려가다’이다.","o":["O","X"],"a":0,"qe":"The opposite of '올라가다' (to go up) is '내려가다' (to go down)."},{"q":"‘상승하다’의 반대말은 ‘하락하다’이다.","o":["O","X"],"a":0,"qe":"The opposite of '상승하다' (to rise) is '하락하다' (to fall)."},{"q":"‘현실적’의 반대말은 ‘비현실적’이다.","o":["O","X"],"a":0,"qe":"The opposite of '현실적' (realistic) is '비현실적' (unrealistic)."},{"q":"‘이성’의 반대말은 ‘동성’이다.","o":["O","X"],"a":0,"qe":"The opposite of '이성' (the opposite sex) is '동성' (the same sex)."}],"b":1,"lt":1},{"id":"t11","title":"Quiz 11","qs":[{"q":"‘기쁨’의 반대말은 ‘슬픔’이다.","o":["O","X"],"a":0,"qe":"The opposite of '기쁨' (joy) is '슬픔' (sadness)."},{"q":"‘성공’의 반대말은 ‘실패’이다.","o":["O","X"],"a":0,"qe":"The opposite of '성공' (success) is '실패' ( const getSubs=()=>{const r={};for(const k in BUILTIN)r[k]=[...BUILTIN[k]];for(const k in S.subs)r[k]=[...(r[k]||[]),...S.subs[k]];return r};
const A={
  go:v=>go(v),
  async unlock(){
    if(!window.crypto||!crypto.subtle)return alert('Please open the app from its https link.');
    if(await sha($('#pw').value)===PW){localStorage.setItem('ep_ok',PW);R()}else alert('Wrong password');
  },
  lock(){localStorage.removeItem('ep_ok');go('exsub')},
  async up(){if(!ok())return;
    const sub=$('#sub').value||$('#ns').value.trim(),f=$('#file').files[0];
    if(!sub||!f)return alert('Choose a subject and a text file.');
    const qs=parse(await f.text());
    if(!qs.length)return alert('No questions found in this file.');
    D={sub,title:$('#ti').value.trim()||f.name.replace(/\.txt$/i,''),qs,i:0};go('answers');
  },
  setans(v){D.qs[D.i].a=+v;R()},
  prev(){D.i--;R()},next(){D.i++;R()},
  async finish(){if(!ok())return;
    if(D.edit){save();Sub=D.sub;return go('exlist')}
    if(S.cfg.key){busy('Translating to English…');
      try{await translate(D.qs)}catch(e){alert('Translation failed: '+e.message+'\nSaved in Korean only. You can retry with the Translate button.')}}
    (S.subs[D.sub]=S.subs[D.sub]||[]).push({id:Date.now(),title:D.title,qs:D.qs,date:new Date().toISOString()});
    save();Sub=D.sub;go('exlist');
  },
  subj(v){Sub=v;go('exlist')},
  start(w){const ex=find(w)||Q.ex;Q={ex,i:0,sel:[]};go('quiz')},
  edit(w){if(!ok())return;const ex=find(w);D={sub:Sub,title:ex.title,qs:ex.qs,i:0,edit:1};go('answers')},
  async tr(w){if(!ok())return;
    if(!S.cfg.key)return alert('Add your OpenRouter key in Settings first.');
    busy('Translating to English…');
    try{await translate(find(w).qs);save()}catch(e){alert('Translation failed: '+e.message)}
    go('exlist');
  },
  del(w){if(!ok())return;if(confirm('Delete this exam?')){S.subs[Sub]=S.subs[Sub].filter(e=>e.id!=w);if(!S.subs[Sub].length)delete S.subs[Sub];save();go(S.subs[Sub]?'exlist':'exsub')}},
  pick(v){if(Q.sel[Q.i]!=null)return;Q.sel[Q.i]=+v;R()},
  nq(){if(Q.i<Q.ex.qs.length-1){Q.i++;R();scrollTo(0,0)}else go('result')},
  cfg(){S.cfg.key=$('#key').value.trim();S.cfg.model=$('#model').value.trim()||'anthropic/claude-sonnet-4.5';save();alert('Saved')},
  fs(v){S.cfg.fs=Math.min(30,Math.max(16,S.cfg.fs+ +v));save();fs();R()},
  exp(){
    const b=new Blob([JSON.stringify({subs:S.subs})],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='exam-backup.json';a.click();
  },
  imp(){$('#bk').click()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.v??b.dataset.w,b.dataset.w)});
document.addEventListener('change',async e=>{
  if(e.target.id=='sub')$('#ns').style.display=e.target.value?'none':'block';
  if(e.target.id=='bk'){try{const j=JSON.parse(await e.target.files[0].text());if(j.subs){S.subs=j.subs;save();alert('Restored');go('exsub')}}catch(x){alert('Invalid backup file')}}
});
R();
</script></body></html>
